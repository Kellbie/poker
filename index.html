<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<style>

  :root{
    --felt-dark:#0a2a20;
    --felt:#0f3d2e;
    --felt-light:#175943;
    --ink:#f4ecd8;
    --ink-dim:#a9c2b8;
    --ink-faint:#6f8c81;
    --gold:#d1a63a;
    --gold-bright:#f0cd6b;
    --red:#c1503f;
    --blue:#3f7ea6;
    --line: rgba(244,236,216,0.14);
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Code","Segoe UI Mono","Roboto Mono",Menlo,Consolas,monospace;}
  .display{font-family:"Courier New",Courier,monospace;font-weight:700;letter-spacing:0.5px;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:18px 16px 90px;}
  .center-col{display:flex;flex-direction:column;justify-content:center;flex:1;gap:22px;}

  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
  .brand .chip-dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 60%, #8a6a1c 100%);box-shadow:0 0 0 2px rgba(244,236,216,0.25);}
  h1.display{font-size:28px;margin:0;letter-spacing:0.5px;color:var(--ink);}
  .tagline{color:var(--ink-dim);font-size:13px;margin:4px 0 0;}

  .card{
    background:linear-gradient(180deg, rgba(244,236,216,0.06), rgba(244,236,216,0.02));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
  }
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-dim);margin-bottom:6px;}
  input[type=text], input[type=number]{
    width:100%;
    background:rgba(0,0,0,0.25);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:12px 14px;
    font-size:16px;
    font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    outline:none;
  }
  input:focus{border-color:var(--gold);}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  button{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:10px;
    padding:13px 16px;
    cursor:pointer;
    transition:transform .08s ease, filter .15s ease, opacity .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button:active{transform:scale(0.97);}
  button:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-primary{background:linear-gradient(180deg, var(--gold-bright), var(--gold));color:#241a04;}
  .btn-primary:not(:disabled):hover{filter:brightness(1.05);}
  .btn-ghost{background:rgba(244,236,216,0.08);color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:linear-gradient(180deg, #d76f5f, var(--red));color:#2a0e08;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 10px;font-size:13px;border-radius:8px;}

  .divider{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:12px;margin:16px 0;text-transform:uppercase;letter-spacing:.08em;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}

  .error-text{color:#f0a58c;font-size:13px;margin-top:8px;}
  .hint{color:var(--ink-faint);font-size:12px;margin-top:8px;line-height:1.5;}

  .lobby-players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .lobby-players li{
    display:flex;align-items:center;gap:10px;
    background:rgba(0,0,0,0.2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
  }
  .seat-num{font-family:ui-monospace,monospace;color:var(--ink-faint);font-size:12px;width:20px;}
  .lobby-players .pname{flex:1;font-weight:600;}
  .host-badge{font-size:10px;background:var(--gold);color:#241a04;padding:2px 6px;border-radius:5px;font-weight:700;letter-spacing:.04em;}
  .you-badge{font-size:10px;color:var(--ink-faint);border:1px solid var(--line);padding:2px 6px;border-radius:5px;}
  .reorder-btns{display:flex;flex-direction:column;gap:2px;}
  .reorder-btns button{padding:2px 6px;font-size:10px;line-height:1;}

  .table-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .pot-box{text-align:center;}
  .pot-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim);}
  .pot-amount{font-family:ui-monospace,monospace;font-size:30px;font-weight:700;color:var(--gold-bright);}
  .street-badge{
    font-family:ui-monospace,monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--ink-dim);background:rgba(0,0,0,0.25);border:1px solid var(--line);
    padding:5px 10px;border-radius:20px;display:inline-block;
  }
  .hand-num{font-size:11px;color:var(--ink-faint);}

  .players-list{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .prow{
    display:flex;align-items:center;gap:10px;
    background:rgba(0,0,0,0.22);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    position:relative;
  }
  .prow.is-turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 16px rgba(209,166,58,0.25);}
  .prow.is-folded{opacity:0.45;}
  .prow.is-you{background:rgba(63,126,166,0.12);}
  .badges{display:flex;gap:4px;min-width:56px;}
  .badge{
    font-family:ui-monospace,monospace;font-size:10px;font-weight:700;
    width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .badge.D{background:var(--ink);color:#1a1a1a;}
  .badge.SB{background:var(--blue);color:#fff;}
  .badge.BB{background:var(--red);color:#fff;}
  .pinfo{flex:1;min-width:0;}
  .pname-row{display:flex;align-items:center;gap:6px;}
  .pname{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pstatus{font-size:11px;color:var(--ink-faint);}
  .pnums{text-align:right;}
  .pstack{font-family:ui-monospace,monospace;font-size:14px;font-weight:600;color:var(--ink);}
  .pbet{font-family:ui-monospace,monospace;font-size:12px;color:var(--gold-bright);}

  .action-bar{
    position:sticky;bottom:0;
    background:linear-gradient(0deg, var(--felt-dark) 60%, rgba(15,61,46,0));
    padding-top:16px;margin-top:auto;
  }
  .waiting-note{
    text-align:center;color:var(--ink-dim);font-size:13px;
    padding:16px;background:rgba(0,0,0,0.2);border-radius:12px;border:1px solid var(--line);
  }
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .action-grid button{padding:15px 10px;font-size:14.5px;}
  .raise-panel{background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;}
  .quick-raises{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .quick-raises button{flex:1;min-width:70px;}

  .winner-select{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
  .winner-opt{
    display:flex;align-items:center;gap:10px;
    background:rgba(0,0,0,0.22);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;
  }
  .winner-opt.selected{border-color:var(--gold);background:rgba(209,166,58,0.12);}
  .winner-opt input{width:18px;height:18px;accent-color:var(--gold);}

  .log-panel{max-height:110px;overflow-y:auto;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ink-faint);background:rgba(0,0,0,0.2);border-radius:10px;padding:8px 10px;margin-top:10px;}
  .log-panel div{padding:1px 0;}

  .top-links{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .link-btn{background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;cursor:pointer;padding:4px;}

  .standings li{display:flex;justify-content:space-between;align-items:center;}
  .standings .place{font-family:ui-monospace,monospace;color:var(--gold-bright);width:26px;}

  .hidden{display:none !important;}

  @media (min-width:600px){ #app{padding-top:36px;} }



  /* ===== view-transition tuning (safe default: gentle crossfade, no wild slides) ===== */
  ::view-transition-old(*), ::view-transition-new(*) { animation-duration: 260ms; }

  /* ===== safe-area aware app shell ===== */
  #app{padding-bottom: calc(90px + env(safe-area-inset-bottom));}
  #app.has-bottom-nav{padding-bottom: calc(150px + env(safe-area-inset-bottom));}

  /* ===== splash screen ===== */
  #splash{
    position:fixed;inset:0;z-index:1000;
    background:radial-gradient(ellipse at 50% 40%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transition:opacity 380ms ease, visibility 380ms ease;
  }
  #splash.fade-out{opacity:0;visibility:hidden;pointer-events:none;}
  #splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,0.45);
    animation:splashPop 520ms cubic-bezier(.2,1.4,.4,1) both;}
  #splash .splash-word{font-size:26px;letter-spacing:3px;color:var(--ink);
    animation:splashFadeUp 420ms ease 120ms both;}
  #splash .splash-tag{font-size:12px;color:var(--ink-faint);letter-spacing:1px;
    animation:splashFadeUp 420ms ease 220ms both;}
  @keyframes splashPop{ from{ transform:scale(.7); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @keyframes splashFadeUp{ from{ transform:translateY(8px); opacity:0; } to{ transform:translateY(0); opacity:1; } }

  /* ===== redesigned landing ===== */
  .landing-hero{text-align:center;margin-bottom:6px;}
  .landing-hero .chip-dot{width:16px;height:16px;margin:0 auto 10px;}
  .landing-hero h1.display{font-size:32px;}
  .landing-hero .tagline{font-size:14px;margin-top:6px;}
  .big-card{
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg, rgba(244,236,216,0.07), rgba(244,236,216,0.02));
    border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease, border-color .12s ease;
  }
  .big-card:active{transform:scale(0.98);}
  .big-card.is-primary{border-color:rgba(209,166,58,0.4);}
  .big-card .suit-badge{
    width:48px;height:48px;border-radius:12px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:24px;
    background:rgba(0,0,0,0.25);
  }
  .big-card.is-primary .suit-badge{background:linear-gradient(180deg, var(--gold-bright), var(--gold));color:#241a04;}
  .big-card .big-card-title{font-weight:700;font-size:16.5px;color:var(--ink);}
  .big-card .big-card-sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}

  /* ===== bottom navigation ===== */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    max-width:520px;margin:0 auto;
    display:flex;
    background:linear-gradient(180deg, rgba(10,42,32,0.92), var(--felt-dark) 30%);
    border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    backdrop-filter:blur(6px);
  }
  .bottom-nav button{
    flex:1;background:none;border:none;color:var(--ink-faint);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:6px 4px;border-radius:10px;
    transition:color .15s ease;
  }
  .bottom-nav button .nav-icon{font-size:19px;line-height:1;}
  .bottom-nav button.active{color:var(--gold-bright);}
  .bottom-nav button.active .nav-icon{transform:translateY(-1px);}

  /* ===== player cards (table + roster) ===== */
  .player-card{
    view-transition-name: none;
    background:linear-gradient(180deg, rgba(244,236,216,0.05), rgba(0,0,0,0.18));
    border:1px solid var(--line);border-radius:16px;padding:14px;
    display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
    transition:opacity .3s ease, transform .3s ease;
  }
  .player-card.is-turn{
    border-color:var(--gold);
    box-shadow:0 0 0 1px var(--gold), 0 0 22px rgba(209,166,58,0.3);
    animation:turnPulse 1.6s ease-in-out infinite;
  }
  @keyframes turnPulse{
    0%,100%{ box-shadow:0 0 0 1px var(--gold), 0 0 14px rgba(209,166,58,0.22); }
    50%{ box-shadow:0 0 0 1px var(--gold-bright), 0 0 28px rgba(209,166,58,0.42); }
  }
  .player-card.is-out{opacity:0.4;transform:scale(0.98);}
  .player-card.is-folded{opacity:0.5;}
  .player-card.is-winner{border-color:var(--gold-bright);box-shadow:0 0 0 1px var(--gold-bright), 0 0 26px rgba(240,205,107,0.5);}
  .pc-top{display:flex;align-items:center;justify-content:space-between;}
  .pc-name-row{display:flex;align-items:center;gap:8px;min-width:0;}
  .pc-status-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:0 0 auto;}
  .pc-status-dot.online{background:#4caf7d;}
  .pc-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pc-your-turn{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--gold-bright);
    background:rgba(209,166,58,0.14);border:1px solid rgba(209,166,58,0.35);
    padding:3px 8px;border-radius:20px;
  }
  .pc-badges{display:flex;gap:4px;}
  .pc-stack{font-family:ui-monospace,monospace;font-size:22px;font-weight:700;color:var(--ink);text-align:center;padding:4px 0;}
  .pc-bottom{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--ink-faint);}
  .pc-dealer-dot{display:inline-flex;align-items:center;gap:5px;color:var(--ink-dim);}
  .pc-bet-chip{
    font-family:ui-monospace,monospace;font-size:11.5px;color:var(--gold-bright);
    background:rgba(0,0,0,0.25);border-radius:20px;padding:2px 9px;
  }

  /* ===== bottom sheet (raise panel) ===== */
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:80;
    opacity:0;transition:opacity 220ms ease;
  }
  .sheet-backdrop.open{opacity:1;}
  .bottom-sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:81;max-width:520px;margin:0 auto;
    background:linear-gradient(180deg, var(--felt-light), var(--felt) 70%);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform 260ms cubic-bezier(.2,.9,.3,1);
    box-shadow:0 -12px 30px rgba(0,0,0,0.4);
  }
  .bottom-sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px;}
  .sheet-title{font-weight:700;font-size:15px;text-align:center;margin-bottom:14px;}
  .sheet-amount{font-family:ui-monospace,monospace;font-size:34px;font-weight:700;text-align:center;color:var(--gold-bright);margin-bottom:12px;}
  .sheet-slider{width:100%;accent-color:var(--gold);margin-bottom:14px;}
  .sheet-actions{display:flex;gap:10px;}
  .sheet-actions button{flex:1;}

  /* ===== QR flow polish ===== */
  .qr-step-label{
    font-family:ui-monospace,monospace;font-size:11px;color:var(--gold-bright);
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;
  }
  .qr-spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid var(--line);border-top-color:var(--gold-bright);
    display:inline-block;animation:spin 800ms linear infinite;vertical-align:middle;margin-right:6px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .connected-check{
    width:64px;height:64px;border-radius:50%;background:rgba(76,175,125,0.15);
    border:2px solid #4caf7d;color:#4caf7d;font-size:30px;
    display:flex;align-items:center;justify-content:center;margin:6px auto 14px;
    animation:splashPop 420ms cubic-bezier(.2,1.4,.4,1) both;
  }

  /* ===== history tab ===== */
  .history-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin:16px 0 8px;}
  .history-group-label:first-child{margin-top:0;}
  .history-entry{
    background:rgba(0,0,0,0.2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;
  }
  .history-entry-top{display:flex;justify-content:space-between;color:var(--ink-faint);font-size:12px;margin-bottom:8px;}
  .history-medal-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13.5px;}
  .history-medal-row .medal{width:20px;}
  .history-medal-row .net-pos{color:#4caf7d;font-family:ui-monospace,monospace;}
  .history-medal-row .net-neg{color:var(--red);font-family:ui-monospace,monospace;}
  .history-empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:40px 20px;}

  /* ===== game over redesign ===== */
  .gameover-trophy{font-size:52px;text-align:center;margin-bottom:6px;}
  .gameover-winner{font-family:ui-monospace,monospace;font-size:22px;font-weight:700;text-align:center;color:var(--gold-bright);}
  .gameover-sub{text-align:center;color:var(--ink-dim);font-size:13px;margin-top:4px;}

  /* ===== misc ===== */
  .settings-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px;border-bottom:1px solid var(--line);
  }
  .settings-row:last-child{border-bottom:none;}
  .settings-row-label{font-size:14px;}
  .settings-row-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

  /* ===== toggle switch ===== */
  .switch{position:relative;display:inline-block;width:44px;height:26px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;}
  .switch-track{position:absolute;inset:0;background:rgba(244,236,216,0.14);border:1px solid var(--line);border-radius:14px;transition:background .15s ease;cursor:pointer;}
  .switch-track::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:var(--ink);border-radius:50%;transition:transform .15s ease;}
  .switch input:checked + .switch-track{background:linear-gradient(180deg, var(--gold-bright), var(--gold));border-color:transparent;}
  .switch input:checked + .switch-track::before{transform:translateX(18px);background:#241a04;}

  /* ===== scan viewport liveness indicators ===== */
  .scan-line{
    position:absolute;left:6%;right:6%;height:2px;top:6%;
    background:linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    box-shadow:0 0 8px 1px var(--gold-bright);
    animation:scanSweep 2.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes scanSweep{
    0%,100%{ top:6%; opacity:.9; }
    50%{ top:92%; opacity:.5; }
  }
  .scan-corners{
    position:absolute;inset:6%;pointer-events:none;
    border:2px solid rgba(240,205,107,0.35);border-radius:8px;
  }

  /* ===== online room code display ===== */
  .room-code-display{
    font-size:38px;font-weight:700;letter-spacing:6px;
    color:var(--gold-bright);padding:14px 0;
  }

</style>

<script>
// ---- Core game logic (pure functions, no DOM/storage deps) ----
// Kept separate so it can be unit-tested with node, then pasted into the artifact.

const STREETS = ['preflop', 'flop', 'turn', 'river', 'showdown'];
// smallBlind, bigBlind, and maxBet now live on room state (host-configurable at room creation)
// instead of being fixed constants, so each table can set its own stakes.

function activeSeatOrder(players) {
  // players still in the game (not eliminated), sorted by seat
  return players.filter(p => !p.eliminated).sort((a, b) => a.seat - b.seat);
}

function nextSeatIndex(order, fromPlayerId) {
  const idx = order.findIndex(p => p.id === fromPlayerId);
  if (idx === -1) return 0;
  return (idx + 1) % order.length;
}

function nextPlayerAfter(order, fromPlayerId) {
  if (order.length === 0) return null;
  return order[nextSeatIndex(order, fromPlayerId)];
}

// non-folded, non-eliminated, still able to act voluntarily (has chips and not all-in)
function playersInHand(state) {
  return state.players.filter(p => !p.eliminated && !p.folded);
}

function playersWhoCanAct(state) {
  return playersInHand(state).filter(p => !p.allIn);
}

function startHand(state, rngPick) {
  const order = activeSeatOrder(state.players);
  if (order.length < 2) throw new Error('Need at least 2 players to start a hand');

  let dealerId = state.dealerId;
  if (!dealerId) {
    dealerId = rngPick(order).id; // first hand: random dealer
  } else {
    dealerId = nextPlayerAfter(order, dealerId).id; // rotate to next active seat
  }

  // reset per-hand player fields
  state.players.forEach(p => {
    p.folded = p.eliminated; // eliminated players count as "out" of this hand
    p.allIn = false;
    p.contributedThisStreet = 0;
    p.contributedThisHand = 0;
  });

  state.dealerId = dealerId;
  state.pot = 0;
  state.currentBet = 0;
  state.street = 'preflop';
  state.handNumber = (state.handNumber || 0) + 1;
  state.winners = null;
  state.log = [];

  // Heads-up (2 players) is a special case in poker: the dealer posts the
  // small blind (and acts first preflop, last postflop), not the player after them.
  let sbPlayer, bbPlayer;
  if (order.length === 2) {
    sbPlayer = order.find(p => p.id === dealerId);
    bbPlayer = nextPlayerAfter(order, dealerId);
  } else {
    sbPlayer = nextPlayerAfter(order, dealerId);
    bbPlayer = nextPlayerAfter(order, sbPlayer.id);
  }

  postBlind(state, sbPlayer.id, state.smallBlind);
  postBlind(state, bbPlayer.id, state.bigBlind);
  state.currentBet = Math.max(...state.players.map(p => p.contributedThisStreet));

  const utg = nextPlayerAfter(order, bbPlayer.id);
  state.toAct = buildToActQueue(state, order, utg.id);
  state.turnPlayerId = state.toAct[0] || null;

  if (!state.turnPlayerId) {
    // everyone but the blinds is all-in already (rare with 2 players) -> run it out
    goToNextStreetOrShowdown(state);
  }

  return state;
}

// build the ordered list of player ids who still need to act this street, starting from `firstId`
function buildToActQueue(state, order, firstId) {
  const queue = [];
  let candidate = order.find(p => p.id === firstId);
  for (let i = 0; i < order.length; i++) {
    const cp = findPlayer(state, candidate.id);
    if (!cp.folded && !cp.eliminated && !cp.allIn) queue.push(candidate.id);
    candidate = nextPlayerAfter(order, candidate.id);
  }
  return queue;
}

function findPlayer(state, id) {
  const p = state.players.find(p => p.id === id);
  if (!p) throw new Error('Player not found: ' + id);
  return p;
}

function postBlind(state, playerId, amount) {
  const p = findPlayer(state, playerId);
  const pay = Math.min(amount, p.stack);
  p.stack -= pay;
  p.contributedThisStreet += pay;
  p.contributedThisHand += pay;
  state.pot += pay;
  if (p.stack === 0) p.allIn = true;
}

// action: 'fold' | 'check' | 'call' | 'raise' | 'allin'
// amount: for 'raise', the NEW total bet the player wants to make this street (must be <= MAX_BET)
function applyAction(state, playerId, action, amount) {
  const p = findPlayer(state, playerId);
  if (state.turnPlayerId !== playerId) throw new Error('Not your turn');
  if (p.folded || p.eliminated) throw new Error('Player not in hand');
  if (p.allIn) throw new Error('Player already all-in');

  const toCall = state.currentBet - p.contributedThisStreet;
  const order = activeSeatOrder(state.players);
  let reopened = false; // did this action raise the bet, forcing others to act again?

  if (action === 'fold') {
    p.folded = true;
    state.log.push(`${p.name} folds`);
  } else if (action === 'check') {
    if (toCall > 0) throw new Error('Cannot check, must call ' + toCall);
    state.log.push(`${p.name} checks`);
  } else if (action === 'call') {
    const pay = Math.min(toCall, p.stack);
    p.stack -= pay;
    p.contributedThisStreet += pay;
    p.contributedThisHand += pay;
    state.pot += pay;
    if (p.stack === 0) p.allIn = true;
    state.log.push(`${p.name} calls ${pay}`);
  } else if (action === 'raise') {
    if (amount > state.maxBet) throw new Error('Cannot bet above table max of ' + state.maxBet);
    if (amount <= state.currentBet) throw new Error('Raise must be higher than current bet');
    const needed = amount - p.contributedThisStreet;
    if (needed > p.stack) throw new Error('Not enough chips for that raise (go all-in instead)');
    p.stack -= needed;
    p.contributedThisStreet += needed;
    p.contributedThisHand += needed;
    state.pot += needed;
    if (p.stack === 0) p.allIn = true;
    state.currentBet = amount;
    reopened = true;
    state.log.push(`${p.name} raises to ${amount}`);
  } else if (action === 'allin') {
    const pay = p.stack;
    p.stack = 0;
    p.contributedThisStreet += pay;
    p.contributedThisHand += pay;
    state.pot += pay;
    p.allIn = true;
    if (p.contributedThisStreet > state.currentBet) {
      state.currentBet = Math.min(p.contributedThisStreet, state.maxBet);
      reopened = true;
    }
    state.log.push(`${p.name} goes all-in with ${pay}`);
  } else {
    throw new Error('Unknown action ' + action);
  }

  // remove this player from the to-act queue
  state.toAct = (state.toAct || []).filter(id => id !== playerId);

  if (reopened) {
    // everyone still live (not folded/eliminated/all-in), other than this player, must act again
    const nextUp = nextPlayerAfter(order, playerId).id;
    state.toAct = buildToActQueue(state, order, nextUp).filter(id => id !== playerId);
  }

  advanceTurn(state);
  return state;
}

function advanceTurn(state) {
  const inHand = playersInHand(state);

  if (inHand.length <= 1) {
    finishHandBySingleWinner(state);
    return;
  }

  // IMPORTANT: don't short-circuit on "only one player can still act" here.
  // That lone player may still be facing an unmatched bet (e.g. someone just
  // shoved all-in) and is owed a decision to call/raise/fold. The to-act
  // queue is the single source of truth for who still owes an action this
  // street; it already excludes folded/eliminated/all-in players.
  if (state.toAct.length === 0) {
    goToNextStreetOrShowdown(state);
    return;
  }

  state.turnPlayerId = state.toAct[0];
}

function goToNextStreetOrShowdown(state) {
  const idx = STREETS.indexOf(state.street);
  const next = STREETS[idx + 1];
  state.players.forEach(p => (p.contributedThisStreet = 0));
  state.currentBet = 0;

  if (next === 'showdown') {
    state.street = 'showdown';
    state.turnPlayerId = null;
    state.log.push('Showdown! Reveal cards.');
    return;
  }

  state.street = next;
  const order = activeSeatOrder(state.players);
  const dealer = state.dealerId;
  // first to act postflop = first active, non-folded, non-allin player left of dealer
  const firstToAct = nextPlayerAfter(order, dealer).id;
  state.toAct = buildToActQueue(state, order, firstToAct);
  state.log.push(`-- ${next} --`);

  if (state.toAct.length === 0) {
    // nobody can act (everyone all-in) -> skip straight through remaining streets
    state.turnPlayerId = null;
    if (next === 'river') {
      state.street = 'showdown';
    } else {
      goToNextStreetOrShowdown(state);
    }
    return;
  }
  if (state.toAct.length === 1) {
    // only one player left who could act, but nobody can respond to a bet -> nothing more to decide, run out
    state.turnPlayerId = null;
    if (next === 'river') {
      state.street = 'showdown';
    } else {
      goToNextStreetOrShowdown(state);
    }
    return;
  }
  state.turnPlayerId = state.toAct[0];
}

function finishHandBySingleWinner(state) {
  const winner = playersInHand(state)[0];
  awardPot(state, [winner.id]);
  state.street = 'handover'; // pot awarded, waiting for "next hand"
  state.turnPlayerId = null;
  state.log.push(`${winner.name} wins ${state.pot} (everyone else folded)`);
}

// called from the UI once players reveal cards and agree on winner(s)
function resolveShowdown(state, winnerIds) {
  if (state.street !== 'showdown') throw new Error('Not at showdown');
  awardPot(state, winnerIds);
  state.street = 'handover';
  state.log.push(`Pot of ${state.potBeforeAward} split between: ${winnerIds.join(', ')}`);
}

function awardPot(state, winnerIds) {
  const potAmount = state.pot;
  state.potBeforeAward = potAmount;
  const order = activeSeatOrder(state.players);
  const share = Math.floor(potAmount / winnerIds.length);
  let remainder = potAmount - share * winnerIds.length;

  // sort winners by seat proximity to left of dealer to distribute remainder chips fairly
  const sortedWinners = [...winnerIds].sort((a, b) => {
    const pa = findPlayer(state, a), pb = findPlayer(state, b);
    const distA = (nextSeatIndex(order, state.dealerId) - order.findIndex(p => p.id === a) + order.length) % order.length;
    const distB = (nextSeatIndex(order, state.dealerId) - order.findIndex(p => p.id === b) + order.length) % order.length;
    return distA - distB;
  });

  sortedWinners.forEach(id => {
    const p = findPlayer(state, id);
    p.stack += share + (remainder > 0 ? 1 : 0);
    if (remainder > 0) remainder--;
  });

  state.pot = 0;
  state.winners = winnerIds;

  // eliminate anyone at 0 chips
  state.players.forEach(p => {
    if (p.stack <= 0 && !p.eliminated) p.eliminated = true;
  });
}

function gameIsOver(state) {
  return activeSeatOrder(state.players).length <= 1;
}



function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

// ---- HOST controller ----
// Owns the single source of truth `room` object. Every connected peer (guest) is
// represented by a `channel`-like object: { send(jsonString), onmessage, onclose }.
// The host's own local UI also goes through applyLocalAction (no self-messaging needed).
class HostController {
  constructor(hostName, opts) {
    this.hostPeerId = uid();
    this.connections = new Map(); // peerId -> { channel, playerId }
    const hostPlayerId = uid();
    this.hostPlayerId = hostPlayerId;
    this.room = {
      status: 'lobby',
      hostId: hostPlayerId,
      startingStack: opts.startingStack,
      smallBlind: Math.floor(opts.startingBet / 2),
      bigBlind: opts.startingBet,
      maxBet: opts.maxBet,
      players: [{ id: hostPlayerId, name: hostName, seat: 0, stack: opts.startingStack, connected: true, eliminated: false, folded: false, allIn: false, contributedThisStreet: 0, contributedThisHand: 0 }],
      dealerId: null, pot: 0, currentBet: 0, street: null, handNumber: 0, log: [], toAct: [], turnPlayerId: null, winners: null,
    };
    this.onStateChange = opts.onStateChange || (() => {});
  }

  broadcast() {
    const payload = JSON.stringify({ t: 'state', room: this.room });
    for (const conn of this.connections.values()) {
      if (conn.playerId) conn.channel.send(payload);
    }
    this.onStateChange(this.room);
  }

  // called once a new RTCDataChannel to a guest is open
  attachConnection(peerId, channel) {
    this.connections.set(peerId, { channel, playerId: null });
    channel.onmessage = (raw) => this.handleMessage(peerId, JSON.parse(raw));
    channel.onclose = () => this.handleDisconnect(peerId);
  }

  handleDisconnect(peerId) {
    const conn = this.connections.get(peerId);
    if (conn && conn.playerId) {
      const p = this.room.players.find(pl => pl.id === conn.playerId);
      if (p) p.connected = false;
      this.broadcast();
    }
    this.connections.delete(peerId);
  }

  handleMessage(peerId, msg) {
    const conn = this.connections.get(peerId);
    if (!conn) return;
    try {
      if (msg.t === 'hello') {
        this.handleHello(peerId, conn, msg);
        return;
      }
      // all other message types require an established player identity
      if (!conn.playerId) throw new Error('Not joined yet');
      const player = findPlayer(this.room, conn.playerId);

      if (msg.t === 'action') {
        applyAction(this.room, conn.playerId, msg.action, msg.amount);
        if (gameIsOver(this.room)) this.room.status = 'over';
        this.broadcast();
      } else if (msg.t === 'declareWinners') {
        resolveShowdown(this.room, msg.winnerIds);
        if (gameIsOver(this.room)) this.room.status = 'over';
        this.broadcast();
      } else if (msg.t === 'nextHand') {
        if (gameIsOver(this.room)) { this.room.status = 'over'; }
        else { startHand(this.room, arr => arr[Math.floor(Math.random() * arr.length)]); }
        this.broadcast();
      } else if (msg.t === 'rematch') {
        this.doRematch();
      } else {
        throw new Error('Unknown message type ' + msg.t);
      }
    } catch (e) {
      conn.channel.send(JSON.stringify({ t: 'error', message: e.message }));
    }
  }

  handleHello(peerId, conn, msg) {
    if (this.room.status !== 'lobby') {
      // allow reconnect-by-name mid-game; reject brand-new joins mid-game
      const existing = this.room.players.find(p => p.name === msg.name && !p.connected);
      if (!existing) {
        conn.channel.send(JSON.stringify({ t: 'joinRejected', reason: 'Game already in progress.' }));
        return;
      }
      existing.connected = true;
      conn.playerId = existing.id;
      conn.channel.send(JSON.stringify({ t: 'joined', youAre: existing.id }));
      this.broadcast();
      return;
    }
    // lobby: also check for a matching disconnected name first (rejoin), else add fresh
    const existing = this.room.players.find(p => p.name === msg.name && !p.connected);
    if (existing) {
      existing.connected = true;
      conn.playerId = existing.id;
    } else {
      const newId = uid();
      this.room.players.push({ id: newId, name: msg.name, seat: this.room.players.length, stack: this.room.startingStack, connected: true, eliminated: false, folded: false, allIn: false, contributedThisStreet: 0, contributedThisHand: 0 });
      conn.playerId = newId;
    }
    conn.channel.send(JSON.stringify({ t: 'joined', youAre: conn.playerId }));
    this.broadcast();
  }

  // ---- host's own local actions (host is also a player at the table) ----
  applyLocalAction(action, amount) {
    applyAction(this.room, this.hostPlayerId, action, amount);
    if (gameIsOver(this.room)) this.room.status = 'over';
    this.broadcast();
  }
  localDeclareWinners(winnerIds) {
    resolveShowdown(this.room, winnerIds);
    if (gameIsOver(this.room)) this.room.status = 'over';
    this.broadcast();
  }
  localStartGame() {
    this.room.status = 'playing';
    startHand(this.room, arr => arr[Math.floor(Math.random() * arr.length)]);
    this.broadcast();
  }
  localNextHand() {
    if (gameIsOver(this.room)) { this.room.status = 'over'; }
    else { startHand(this.room, arr => arr[Math.floor(Math.random() * arr.length)]); }
    this.broadcast();
  }
  doRematch() {
    this.room.status = 'lobby';
    this.room.players.forEach(p => { p.stack = this.room.startingStack; p.eliminated = false; p.folded = false; p.allIn = false; p.contributedThisStreet = 0; p.contributedThisHand = 0; });
    this.room.dealerId = null; this.room.pot = 0; this.room.currentBet = 0; this.room.street = null;
    this.room.handNumber = 0; this.room.log = []; this.room.toAct = []; this.room.turnPlayerId = null; this.room.winners = null;
    this.broadcast();
  }
  localReorderSeat(playerId, dir) {
    const sorted = [...this.room.players].sort((a, b) => a.seat - b.seat);
    const idx = sorted.findIndex(p => p.id === playerId);
    const swapIdx = idx + dir;
    if (swapIdx < 0 || swapIdx >= sorted.length) return;
    const tmp = sorted[idx].seat; sorted[idx].seat = sorted[swapIdx].seat; sorted[swapIdx].seat = tmp;
    this.broadcast();
  }
}

// ---- GUEST controller ----
// Sends actions to the host and renders whatever `state` messages arrive.
class GuestController {
  constructor(name, channel, opts) {
    this.name = name;
    this.channel = channel;
    this.playerId = null;
    this.room = null;
    this.onStateChange = (opts && opts.onStateChange) || (() => {});
    this.onError = (opts && opts.onError) || (() => {});
    this.onRejected = (opts && opts.onRejected) || (() => {});
    channel.onmessage = (raw) => this.handleMessage(JSON.parse(raw));
    channel.send(JSON.stringify({ t: 'hello', name }));
  }
  handleMessage(msg) {
    if (msg.t === 'joined') { this.playerId = msg.youAre; }
    else if (msg.t === 'state') { this.room = msg.room; this.onStateChange(this.room); }
    else if (msg.t === 'error') { this.onError(msg.message); }
    else if (msg.t === 'joinRejected') { this.onRejected(msg.reason); }
  }
  sendAction(action, amount) { this.channel.send(JSON.stringify({ t: 'action', action, amount })); }
  sendDeclareWinners(winnerIds) { this.channel.send(JSON.stringify({ t: 'declareWinners', winnerIds })); }
  sendNextHand() { this.channel.send(JSON.stringify({ t: 'nextHand' })); }
  sendRematch() { this.channel.send(JSON.stringify({ t: 'rematch' })); }
}



if (typeof window !== 'undefined') { window.HostController = HostController; window.GuestController = GuestController; }


/* ---- WebRTC signaling (LAN-only, no STUN/TURN since there's no internet) ---- */
// Empty iceServers keeps candidate gathering fast and LAN-only when everyone's
// on the same hotspot (no wasted time probing servers you don't need). Adding
// a public STUN server costs nothing for that same-hotspot case (the LAN
// candidates still win, since they're gathered fastest and preferred) but
// means devices that AREN'T on the same network — genuinely remote friends,
// or a hotspot with unusual NAT behavior — get a real shot at connecting too.
// STUN only ever *discovers* your own public address; it never sees or
// relays any game traffic. This is the one case where the app briefly
// contacts an external server — only to ask "what's my public IP", and only
// if you have internet at all. On a true offline hotspot it just times out
// silently and the LAN candidates carry the connection as before.
const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function waitIceGatheringComplete(pc, timeoutMs) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') { resolve(); return; }
    let done = false;
    const finish = () => { if (done) return; done = true; pc.removeEventListener('icegatheringstatechange', check); resolve(); };
    const check = () => { if (pc.iceGatheringState === 'complete') finish(); };
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(finish, timeoutMs);
  });
}

// Real devices often gather several ICE candidates (WiFi, cellular still up,
// IPv6 link-local, redundant duplicates, etc.) — each candidate line adds
// ~90-130 characters to the SDP, which is the single biggest driver of QR
// scanning pain (more candidates -> bigger payload -> more/denser QR frames
// -> harder to scan). Since this app only ever needs to connect over the
// local hotspot LAN, we can safely trim to a small set of the most useful
// UDP host candidates before this SDP ever gets turned into a QR code.
function minifySdpCandidates(sdp, maxCandidates) {
  maxCandidates = maxCandidates || 2;
  const lines = sdp.split('\r\n').filter((l) => l.length > 0 || true);
  const candidateLines = [];
  const otherLines = [];
  for (const line of lines) {
    if (line.startsWith('a=candidate:')) candidateLines.push(line);
    else otherLines.push(line);
  }

  const parsed = candidateLines.map((line) => {
    const parts = line.split(' ');
    // a=candidate:<foundation> <component> <proto> <priority> <ip> <port> typ <type> ...
    const proto = (parts[2] || '').toLowerCase();
    const priority = parseInt(parts[3], 10) || 0;
    const ip = parts[4] || '';
    const typ = parts[7] || '';
    const isIPv4 = /^\d+\.\d+\.\d+\.\d+$/.test(ip);
    return { line, proto, priority, ip, typ, isIPv4 };
  });

  // Reserve a slot for the best srflx (STUN/public) candidate if one exists,
  // so online/remote connectivity is always represented — otherwise, on a
  // device with several LAN candidates, the srflx one could get crowded out
  // entirely and "online mode" would silently never actually work.
  const byType = (typ) => parsed
    .filter((c) => c.proto === 'udp' && c.typ === typ)
    .sort((a, b) => (a.isIPv4 !== b.isIPv4 ? (a.isIPv4 ? -1 : 1) : b.priority - a.priority));
  const hostCandidates = byType('host');
  const srflxCandidates = byType('srflx');

  const keptSet = [];
  if (srflxCandidates.length > 0) keptSet.push(srflxCandidates[0]);
  for (const c of hostCandidates) {
    if (keptSet.length >= maxCandidates) break;
    keptSet.push(c);
  }
  // if there's still room and more than one srflx candidate exists, allow a second
  for (const c of srflxCandidates.slice(1)) {
    if (keptSet.length >= maxCandidates) break;
    keptSet.push(c);
  }
  const filtered = keptSet.slice(0, maxCandidates).map((c) => c.line);

  // Fallback: if filtering somehow removed everything (unexpected candidate
  // format), keep the original candidates rather than produce a connection
  // with zero candidates.
  const keptCandidates = filtered.length > 0 ? filtered : candidateLines.slice(0, maxCandidates);

  // Filter candidates in place — never move or reorder any line. Moving
  // candidates elsewhere in the SDP (an earlier version of this function
  // spliced them in right after "m=application") put them ahead of the
  // "c=" connection line, which violates SDP's required line ordering
  // (RFC 4566: c= must precede any a= lines in a media section). Some
  // parsers tolerate that anyway; evidently not all of them do — this was
  // producing SDP that some devices silently failed to fully negotiate
  // (ondatachannel never firing), rather than throwing a catchable error.
  // Filtering in place guarantees the output is always a strict ordered
  // subset of the original, valid lines — nothing is ever relocated.
  const keepLineSet = new Set(keptCandidates);
  const out = lines.filter((line) => !line.startsWith('a=candidate:') || keepLineSet.has(line));
  return out.join('\r\n');
}

// HOST side: create the offer for one new guest connection.
async function createHostOffer() {
  const pc = new RTCPeerConnection(RTC_CONFIG);
  const dc = pc.createDataChannel('poker', { ordered: true });
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitIceGatheringComplete(pc, 4000);
  const trimmedSdp = minifySdpCandidates(pc.localDescription.sdp);
  const payload = JSON.stringify({ type: 'offer', sdp: trimmedSdp });
  return { pc, dc, payload };
}
async function applyHostAnswer(pc, answerObj) {
  await pc.setRemoteDescription({ type: 'answer', sdp: answerObj.sdp });
}

// GUEST side: given the host's offer payload, produce an answer + the incoming data channel.
function createGuestAnswer(offerObj) {
  return new Promise(async (resolve, reject) => {
    try {
      const pc = new RTCPeerConnection(RTC_CONFIG);
      let dc = null;
      // Bounded, unlike before — if ondatachannel never fires (malformed
      // offer, browser quirk, whatever), this now fails with a clear,
      // actionable message instead of hanging on "connecting…" forever.
      const dcPromise = new Promise((res, rej) => {
        pc.ondatachannel = (e) => { dc = e.channel; res(e.channel); };
        setTimeout(() => rej(new Error("Couldn't finish connecting — the code may be stale. Go back and get a fresh one.")), 6000);
      });
      await pc.setRemoteDescription({ type: 'offer', sdp: offerObj.sdp });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await waitIceGatheringComplete(pc, 4000);
      await dcPromise;
      const trimmedSdp = minifySdpCandidates(pc.localDescription.sdp);
      const payload = JSON.stringify({ type: 'answer', sdp: trimmedSdp });
      resolve({ pc, dc, payload });
    } catch (e) { reject(e); }
  });
}

function waitForOpen(dc, timeoutMs) {
  return new Promise((resolve, reject) => {
    if (dc.readyState === 'open') { resolve(); return; }
    const t = setTimeout(() => reject(new Error('Connection timed out — make sure both devices are on the same hotspot/WiFi network and try again.')), timeoutMs);
    dc.addEventListener('open', () => { clearTimeout(t); resolve(); }, { once: true });
  });
}

/* ---- QR chunk protocol: split a JSON payload across multiple QR frames if it's too big for one reliable scan ---- */
// A single STATIC QR code the user can take their time on beats a race
// against any flip timer, no matter how dense it is — so this threshold is
// set generously high to keep the vast majority of real WebRTC offers/
// answers as ONE code instead of forcing a multi-frame cycle at all. Only
// unusually large payloads (lots of gathered ICE candidates) fall back to
// chunking, which still exists as a safety net with generous per-frame time.
const QR_CHUNK_SIZE = 420;

function payloadToFrames(payloadStr) {
  if (payloadStr.length <= QR_CHUNK_SIZE) {
    return [JSON.stringify({ i: 0, n: 1, c: payloadStr })];
  }
  const chunks = [];
  for (let i = 0; i < payloadStr.length; i += QR_CHUNK_SIZE) chunks.push(payloadStr.slice(i, i + QR_CHUNK_SIZE));
  return chunks.map((c, i) => JSON.stringify({ i, n: chunks.length, c }));
}

/* ---- QR rendering (uses inlined qrcode-generator lib, global `qrcode`) ---- */
// A QR code needs a blank "quiet zone" border for a scanner to reliably lock
// onto its finder patterns — without one, anything visually adjacent (a
// heading, a background gradient) can throw off detection entirely. This
// matters a lot more here than it would printed on paper, since the camera
// is looking at the whole phone screen, not an isolated code on white space.
const QR_QUIET_ZONE_MODULES = 4;

function renderQrToCanvas(text, canvas, cellSize) {
  const qr = qrcode(0, 'L');
  qr.addData(text);
  qr.make();
  const count = qr.getModuleCount();
  const totalModules = count + QR_QUIET_ZONE_MODULES * 2;
  const size = totalModules * cellSize;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  // Pure black/white — the safest, most universally scannable choice.
  // Colored codes CAN work but add risk under real-world lighting/white
  // balance that isn't worth taking for something this important.
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000000';
  for (let r = 0; r < count; r++) {
    for (let c = 0; c < count; c++) {
      if (qr.isDark(r, c)) ctx.fillRect((c + QR_QUIET_ZONE_MODULES) * cellSize, (r + QR_QUIET_ZONE_MODULES) * cellSize, cellSize, cellSize);
    }
  }
}

/* ---- QR scanning via camera (uses inlined jsQR lib, global `jsQR`) ---- */
class QrScanner {
  constructor(videoEl, canvasEl) {
    this.video = videoEl;
    this.canvas = canvasEl;
    this.ctx = canvasEl.getContext('2d', { willReadFrequently: true });
    this.stream = null;
    this.rafId = null;
    this.chunks = new Map();
    this.totalChunks = null;
  }

  async start(onProgress) {
    this.chunks = new Map();
    this.totalChunks = null;
    this.onProgress = onProgress || (() => {});
    const constraints = {
      video: {
        facingMode: 'environment',
        width: { ideal: 960 },
        height: { ideal: 960 },
        advanced: [{ focusMode: 'continuous' }],
      },
    };
    try {
      this.stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      try {
        this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      } catch (e2) {
        this.stream = await navigator.mediaDevices.getUserMedia({ video: true });
      }
    }
    this.video.srcObject = this.stream;
    await this.video.play();
    this._startedAt = Date.now();
    return new Promise((resolve, reject) => {
      this._resolve = resolve;
      this._reject = reject;
      this._tick();
    });
  }

  _tick() {
    if (!this.stream) return; // stopped
    try {
      if (this.video.readyState === this.video.HAVE_ENOUGH_DATA && this.video.videoWidth > 0) {
        // Decode on a downscaled working copy, not the raw camera resolution.
        // A modern phone camera frame can be 1920x1080+ (~8MB per getImageData
        // call) — decoding that every single frame is unnecessarily heavy and,
        // worse, if it ever throws (memory pressure, a driver quirk) with no
        // try/catch around it, the loop used to die silently forever while the
        // camera preview kept looking "on". QR modules only need a handful of
        // pixels each to resolve, so a modest working resolution is plenty and
        // much faster/more reliable.
        const nativeW = this.video.videoWidth, nativeH = this.video.videoHeight;
        const maxDim = 640;
        const scale = Math.min(1, maxDim / Math.max(nativeW, nativeH));
        const w = Math.round(nativeW * scale), h = Math.round(nativeH * scale);
        if (this.canvas.width !== w || this.canvas.height !== h) { this.canvas.width = w; this.canvas.height = h; }
        this.ctx.drawImage(this.video, 0, 0, w, h);
        const img = this.ctx.getImageData(0, 0, w, h);
        const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) this._handleDecoded(code.data);
        this._frameCount = (this._frameCount || 0) + 1;
        if (this.onFrame) this.onFrame(this._frameCount); // lets the UI show a visible "still scanning" heartbeat
      }
    } catch (e) {
      // Never let a single bad frame kill the whole loop — that was the #1
      // cause of scanning silently going dead while the camera looked fine.
    }
    if (this.stream) this.rafId = requestAnimationFrame(() => this._tick());
  }

  _handleDecoded(raw) {
    let obj;
    try { obj = JSON.parse(raw); } catch (e) { return; } // not our format, ignore this frame
    if (typeof obj.i !== 'number' || typeof obj.n !== 'number' || typeof obj.c !== 'string') return;
    this.totalChunks = obj.n;
    this.chunks.set(obj.i, obj.c);
    this.onProgress(this.chunks.size, this.totalChunks);
    if (this.chunks.size === this.totalChunks) {
      const full = Array.from({ length: this.totalChunks }, (_, i) => this.chunks.get(i)).join('');
      this.stop();
      try {
        const parsed = JSON.parse(full);
        this._resolve(parsed);
      } catch (e) { this._reject(new Error('Scanned code was corrupted — try again.')); }
    }
  }

  stop() {
    if (this.rafId) cancelAnimationFrame(this.rafId);
    this.rafId = null;
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
  }
}


// Wraps a DOM-mutating function in document.startViewTransition when the browser
// supports it (gives free smooth crossfades/morphs between renders for elements
// that share a stable `view-transition-name`). Falls back to calling `fn()`
// directly when unsupported (e.g. current Safari) — the app looks and works
// identically, just without the extra polish.

  if (typeof document !== 'undefined' && typeof document.startViewTransition === 'function') {
    try { return document.startViewTransition(() => fn()); } catch (e) { fn(); return null; }

/* Animate a DOM element's textContent from one integer to another over `duration` ms,
   with thousands separators. Pure easing math extracted so it's unit-testable. */
function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }

  // returns an array of intermediate integer values (inclusive of `to` as the last element)
  const frames = [];
  for (let i = 1; i <= steps; i++) {
    const t = easeOutQuad(i / steps);
    frames.push(Math.round(from + (to - from) * t));
  }
  if (frames[frames.length - 1] !== to) frames[frames.length - 1] = to;
  return frames;
}

const _tweenState = new Map(); // elementKey -> last displayed numeric value

  opts = opts || {};

  const from = _tweenState.has(key) ? _tweenState.get(key) : toValue;
  _tweenState.set(key, toValue);
  if (from === toValue || !el) { if (el) el.textContent = prefix + toValue.toLocaleString(); return; }
  const steps = Math.max(6, Math.min(24, Math.round(duration / 16)));
  const frames = computeTweenFrames(from, toValue, steps);
  let i = 0;
  const stepMs = duration / steps;
  const tick = () => {
    if (i >= frames.length) return;
    el.textContent = prefix + frames[i].toLocaleString();
    i++;
    if (i < frames.length) setTimeout(tick, stepMs);
  };

const HAPTIC_PATTERNS = {

// a single tone: frequency (Hz), start offset (s from now), duration (s), gain envelope
function _tone(ctx, freq, startAt, dur, opts) {

  osc.type = opts.type || 'sine';
  osc.frequency.setValueAtTime(freq, ctx.currentTime + startAt);
  if (opts.slideTo) osc.frequency.linearRampToValueAtTime(opts.slideTo, ctx.currentTime + startAt + dur);
  const peak = opts.gain !== undefined ? opts.gain : 0.12;
  gain.gain.setValueAtTime(0, ctx.currentTime + startAt);
  gain.gain.linearRampToValueAtTime(peak, ctx.currentTime + startAt + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startAt + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime + startAt);
  osc.stop(ctx.currentTime + startAt + dur + 0.02);

// Describes each effect as a list of tones, so the composition is unit-testable
// independent of actually having a working AudioContext.
const SOUND_RECIPES = {
  turn: [{ freq: 660, start: 0, dur: 0.10, type: 'sine', gain: 0.10 }],
  allin: [
    { freq: 220, start: 0, dur: 0.12, type: 'sawtooth', gain: 0.10, slideTo: 440 },
    { freq: 440, start: 0.1, dur: 0.14, type: 'sawtooth', gain: 0.10, slideTo: 660 },
  ],
  bust: [{ freq: 300, start: 0, dur: 0.4, type: 'triangle', gain: 0.12, slideTo: 90 }],
  win: [
    { freq: 523, start: 0, dur: 0.12, type: 'sine', gain: 0.11 },
    { freq: 659, start: 0.09, dur: 0.12, type: 'sine', gain: 0.11 },
    { freq: 784, start: 0.18, dur: 0.22, type: 'sine', gain: 0.12 },
  ],
  deal: [{ freq: 180, start: 0, dur: 0.06, type: 'triangle', gain: 0.06 }],
  chip: [{ freq: 900, start: 0, dur: 0.045, type: 'square', gain: 0.045 }],
};

function playSound(type) {
  if (_soundMuted) return false;
  const recipe = SOUND_RECIPES[type];
  if (!recipe) return false;
  const ctx = _ctx();
  if (!ctx) return false;
  try {
    recipe.forEach(t => _tone(ctx, t.freq, t.start, t.dur, { type: t.type, gain: t.gain, slideTo: t.slideTo }));
    return true;

/* Pure gesture-classification math, kept separate from DOM event wiring so it's
   testable without a real touchscreen. */

// Classify a completed drag given start/end coordinates and elapsed time.
// Returns one of: 'swipe-left', 'swipe-right', 'swipe-down', 'swipe-up', null (not a swipe — too short/slow/diagonal)
function classifySwipe(dx, dy, elapsedMs, opts) {
  opts = opts || {};
  const minDist = opts.minDist || 60;
  const maxElapsed = opts.maxElapsed || 700;
  const axisBias = opts.axisBias || 1.6; // how much longer the dominant axis must be than the other

  if (elapsedMs > maxElapsed) return null;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (Math.max(adx, ady) < minDist) return null;

  if (adx > ady * axisBias) {
    return dx < 0 ? 'swipe-left' : 'swipe-right';
  }
  if (ady > adx * axisBias) {
    return dy < 0 ? 'swipe-up' : 'swipe-down';
  }
  return null; // too diagonal to call confidently
}

// Given the fixed tab order and a current tab, compute the tab a left/right swipe moves to.
// Swiping left (finger moves left, content moves like "next page") advances forward; swiping right goes back.
const TAB_ORDER = ['table', 'players', 'history', 'settings'];
function nextTabForSwipe(currentTab, direction) {
  const idx = TAB_ORDER.indexOf(currentTab);
  if (idx === -1) return currentTab;
  if (direction === 'swipe-left') return TAB_ORDER[Math.min(idx + 1, TAB_ORDER.length - 1)];
  if (direction === 'swipe-right') return TAB_ORDER[Math.max(idx - 1, 0)];
  return currentTab;
}

// Long-press timing helper: given how long the pointer was held and how far it moved,
// decide whether this counts as a long-press (vs. a drag or a quick tap).
function isLongPress(heldMs, movedPx, opts) {
  opts = opts || {};
  const threshold = opts.threshold || 500;
  const moveTolerance = opts.moveTolerance || 12;
  return heldMs >= threshold && movedPx <= moveTolerance;
}


/* Chip-flying-to-winner animation. Split into pure math (testable without a
   browser) and DOM spawning (uses the Web Animations API). */

// How many little chip elements to spawn for a given pot size — clamped so a
// small pot doesn't look bare and a huge pot doesn't spawn hundreds of divs.
function chipCountForPot(potAmount) {
  if (potAmount <= 0) return 0;
  const n = Math.round(3 + Math.log2(Math.max(1, potAmount / 100)));
  return Math.max(4, Math.min(14, n));
}

// Distribute `count` chips across `winnerCount` destinations as evenly as possible.
// Returns an array of winner-indices, one per chip (e.g. 10 chips / 2 winners -> 5 of each).
function distributeChipsAcrossWinners(count, winnerCount) {
  if (winnerCount <= 0) return [];
  const out = [];
  for (let i = 0; i < count; i++) out.push(i % winnerCount);
  return out;
}

// Build the flight plan: for each chip, a {fromX, fromY, toX, toY, delayMs} entry.
// potRect / winnerRects are plain {x, y, width, height} objects (e.g. from getBoundingClientRect()).
// `rand` is injectable for deterministic tests (defaults to Math.random).
function buildChipFlightPlan(potRect, winnerRects, potAmount, rand) {
  rand = rand || Math.random;
  if (!potRect || !winnerRects || winnerRects.length === 0 || potAmount <= 0) return [];
  const count = chipCountForPot(potAmount);
  const assignments = distributeChipsAcrossWinners(count, winnerRects.length);
  const fromX = potRect.x + potRect.width / 2;
  const fromY = potRect.y + potRect.height / 2;
  return assignments.map((winnerIdx, i) => {
    const wr = winnerRects[winnerIdx];
    const jitterX = (rand() - 0.5) * Math.min(30, wr.width * 0.4);
    const jitterY = (rand() - 0.5) * Math.min(20, wr.height * 0.3);
    return {
      fromX, fromY,
      toX: wr.x + wr.width / 2 + jitterX,
      toY: wr.y + wr.height / 2 + jitterY,
      delayMs: Math.floor(i / winnerRects.length) * 45, // stagger waves so it doesn't look like one blob
    };
  });
}

// Spawns and animates the actual chip DOM elements. Safe to call even where
// Web Animations API / getBoundingClientRect aren't fully implemented (e.g.
// test environments) — it just won't visually animate anything in that case.
function animateChipsToWinners(potEl, winnerEls, potAmount) {
  if (typeof document === 'undefined' || !potEl || !winnerEls || winnerEls.length === 0) return 0;
  const potRect = potEl.getBoundingClientRect();
  const winnerRects = winnerEls.map(el => el.getBoundingClientRect());
  const plan = buildChipFlightPlan(potRect, winnerRects, potAmount);
  plan.forEach((leg) => {
    const chip = document.createElement('div');
    chip.style.cssText = 'position:fixed;width:14px;height:14px;border-radius:50%;' +
      'background:radial-gradient(circle at 35% 30%, var(--gold-bright,#f0cd6b), var(--gold,#d1a63a));' +
      'box-shadow:0 2px 6px rgba(0,0,0,0.4);z-index:200;pointer-events:none;';
    chip.style.left = leg.fromX + 'px';
    chip.style.top = leg.fromY + 'px';
    document.body.appendChild(chip);
    const cleanup = () => chip.remove();
    if (typeof chip.animate === 'function') {
      const anim = chip.animate(
        [
          { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: 0 },
          { transform: `translate(${(leg.toX - leg.fromX) * 0.5 - (leg.fromX - leg.fromX)}px, ${(leg.toY - leg.fromY) * 0.3 - 40}px) scale(1.1)`, opacity: 1, offset: 0.5 },
          { transform: `translate(${leg.toX - leg.fromX}px, ${leg.toY - leg.fromY}px) scale(0.6)`, opacity: 0, offset: 1 },
        ],
        { duration: 550, delay: leg.delayMs, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards' }
      );
      anim.onfinish = cleanup;
      anim.oncancel = cleanup;
    } else {
      setTimeout(cleanup, 600 + leg.delayMs);
    }
  });
  return plan.length;
}


/* ---------- Online pairing: short room codes via PeerJS's public broker ----------
   This is the ONLY part of the app that ever needs the internet — it briefly
   asks a public relay (0.peerjs.com) to introduce two devices by a short code,
   then gets out of the way; game data still flows device-to-device afterward,
   same as the offline path. If there's no internet, or the relay is down,
   this mode simply won't connect — the offline QR/share path is unaffected
   either way. */

const ROOM_CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L — easy to read and type aloud
function generateRoomCode(length) {
  length = length || 5;
  let out = '';
  for (let i = 0; i < length; i++) out += ROOM_CODE_ALPHABET[Math.floor(Math.random() * ROOM_CODE_ALPHABET.length)];
  return out;
}
function normalizeRoomCode(input) {
  return String(input || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

const PEER_ID_PREFIX = 'ledger-'; // namespaced so we never collide with unrelated PeerJS apps sharing the public broker

// Wrap a PeerJS DataConnection into the same {send, onmessage, onclose}
// shape wrapDataChannel() gives the offline path, so HostController /
// GuestController work identically regardless of which transport is live.
function wrapPeerConnection(conn) {
  const wrapper = { send: null, onmessage: null, onclose: null };
  wrapper.send = (s) => conn.send(s);
  conn.on('data', (data) => {
    if (!wrapper.onmessage) return;
    // With serialization:'json' PeerJS may hand back an already-parsed value
    // if it wasn't a plain string; normalize back to a string either way so
    // this matches the raw-string contract the protocol layer expects.
    wrapper.onmessage(typeof data === 'string' ? data : JSON.stringify(data));
  });
  conn.on('close', () => { if (wrapper.onclose) wrapper.onclose(); });
  return wrapper;
}

// HOST side: claim a short code on the public broker, resolve once it's live
// and ready to accept incoming connections. Retries with a fresh code on the
// rare chance of a collision with someone else's in-flight session.
function createOnlineHost(PeerCtor, onIncomingConnection, attemptsLeft) {
  attemptsLeft = attemptsLeft == null ? 5 : attemptsLeft;
  return new Promise((resolve, reject) => {
    const code = generateRoomCode();
    const peer = new PeerCtor(PEER_ID_PREFIX + code, { debug: 0 });
    let settled = false;
    peer.on('open', () => {
      if (settled) return;
      settled = true;
      peer.on('connection', (conn) => {
        conn.on('open', () => onIncomingConnection(wrapPeerConnection(conn)));
      });
      resolve({ code, peer });
    });
    peer.on('error', (err) => {
      if (settled) return;
      const isTaken = err && (err.type === 'unavailable-id' || /unavailable/i.test(String(err)));
      peer.destroy && peer.destroy();
      if (isTaken && attemptsLeft > 0) {
        settled = true;
        createOnlineHost(PeerCtor, onIncomingConnection, attemptsLeft - 1).then(resolve, reject);
      } else if (!settled) {
        settled = true;
        reject(new Error(describePeerError(err)));
      }
    });
  });
}

// GUEST side: connect to a host's code. Resolves once the data connection is open.
function joinOnlineHost(PeerCtor, hostCode) {
  return new Promise((resolve, reject) => {
    const peer = new PeerCtor(undefined, { debug: 0 });
    let settled = false;
    peer.on('open', () => {
      const conn = peer.connect(PEER_ID_PREFIX + normalizeRoomCode(hostCode), { reliable: true });
      const timeout = setTimeout(() => {
        if (settled) return;
        settled = true;
        peer.destroy && peer.destroy();
        reject(new Error("Couldn't reach that room code — double-check it and that the host is still on the Online screen."));
      }, 12000);
      conn.on('open', () => {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        resolve({ peer, wrapped: wrapPeerConnection(conn) });
      });
      conn.on('error', (err) => {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        reject(new Error(describePeerError(err)));
      });
    });
    peer.on('error', (err) => {
      if (settled) return;
      settled = true;
      reject(new Error(describePeerError(err)));
    });
  });
}

function describePeerError(err) {
  const type = err && err.type;
  if (type === 'peer-unavailable') return "That room code isn't live right now — ask the host to check they're still on the Online screen.";
  if (type === 'network' || type === 'server-error' || type === 'socket-error' || type === 'socket-closed') return "Couldn't reach the online relay — check your internet connection and try again.";
  if (type === 'browser-incompatible') return "This browser doesn't support the online connection type.";
  return (err && err.message) || 'Could not connect online — try again, or use the offline QR/share option instead.';
}


/* Local, per-device game history. This file runs standalone in the player's own
   browser (downloaded, opened offline) — not inside any hosted sandbox — so
   localStorage is the right, and only available, persistence mechanism here.
   Each device only remembers games it personally hosted or joined; this is
   NOT synced between players. */
const HISTORY_KEY = 'ledger.gameHistory.v1';
const HISTORY_LIMIT = 50;

function _hasStorage() {
  try { return typeof localStorage !== 'undefined'; } catch (e) { return false; }
}

function loadHistory() {
  if (!_hasStorage()) return [];
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

// entry: { endedAt: ms, players: [{name, stack, netChange}], handsPlayed, iWasHost }
function saveGameToHistory(entry) {
  if (!_hasStorage()) return false;
  try {
    const list = loadHistory();
    list.unshift(entry);
    while (list.length > HISTORY_LIMIT) list.pop();
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    return true;
  } catch (e) { return false; }
}

function buildHistoryEntry(room, startingStackPerPlayer, iWasHost) {
  const players = room.players.map(p => ({
    name: p.name,
    stack: p.stack,
    netChange: p.stack - startingStackPerPlayer,
  })).sort((a, b) => b.stack - a.stack);
  return {
    endedAt: Date.now(),
    players,
    handsPlayed: room.handNumber || 0,
    iWasHost: !!iWasHost,
  };
}

function groupHistoryByDay(list) {
  const groups = [];
  let currentKey = null, currentGroup = null;
  const now = new Date();
  const todayKey = now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  const yesterdayKey = yesterday.toDateString();

  for (const entry of list) {
    const d = new Date(entry.endedAt);
    const dayKey = d.toDateString();
    let label = dayKey === todayKey ? 'Tonight' : dayKey === yesterdayKey ? 'Yesterday' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    if (dayKey !== currentKey) {
      currentKey = dayKey;
      currentGroup = { label, entries: [] };
      groups.push(currentGroup);
    }
    currentGroup.entries.push(entry);
  }
  return groups;
}


/* =========================================================================
   INSTALL / ADD TO HOME SCREEN
   Best-effort: if this file ends up served over https/localhost (e.g. the
   host runs a tiny local server, or it's hosted somewhere), the standard
   browser install prompt will work. Opened directly as a downloaded file
   (file://), most browsers won't offer a programmatic install prompt — in
   that case this falls back to clear manual "Add to Home Screen" steps,
   which do work for a local file on every major mobile browser.
   ========================================================================= */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
});

// Attempts to register the real sw.js as a sibling file. This ONLY succeeds if
// Ledger is being served over http(s) or localhost with sw.js sitting next to
// this HTML file — e.g. the host ran a tiny local static server for the night.
// Opened directly as a downloaded file (file://), service worker registration
// is refused by every major browser, full stop — that's a platform security
// rule, not a bug. The app already works fully offline regardless, since
// nothing here makes an external request in the first place.
let _swStatus = 'unsupported'; // 'unsupported' | 'unavailable-file-protocol' | 'registered' | 'failed'
async function tryRegisterServiceWorker() {
  if (!('serviceWorker' in navigator)) { _swStatus = 'unsupported'; return; }
  if (location.protocol === 'file:') { _swStatus = 'unavailable-file-protocol'; return; }
  try {
    await navigator.serviceWorker.register('./sw.js');
    _swStatus = 'registered';
  } catch (e) {
    _swStatus = 'failed';
  }
}
function getServiceWorkerStatus() { return _swStatus; }
tryRegisterServiceWorker();

function isRunningStandalone() {
  const mm = (typeof window.matchMedia === 'function') ? window.matchMedia('(display-mode: standalone)').matches : false;
  return mm || window.navigator.standalone === true;
}
function detectPlatform() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) return 'ios';
  if (/Android/.test(ua)) return 'android';
  return 'desktop';
}

async function handleInstallClick() {
  if (isRunningStandalone()) {
    alert("You're already using the installed app.");
    return;
  }
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    return;
  }
  showInstallInstructions();
}

  document.body.appendChild(overlay);

function onRoomUpdated(newRoom) {
  detectAndFireFeedback(currentRoom, newRoom);
  const prevRoom = currentRoom;
  currentRoom = newRoom;
  if (gameAreaActive) renderGameArea(newRoom);
  maybeTriggerChipFly(prevRoom, newRoom);
  if (newRoom.status === 'over' && !historySaved) {
    historySaved = true;
    saveGameToHistory(buildHistoryEntry(newRoom, startingStackForHistory || newRoom.startingStack, me.isHost));
  }
}

let lastChipFlyHand = null;
function maybeTriggerChipFly(prevRoom, newRoom) {
  if (!newRoom || newRoom.street !== 'handover' || !newRoom.winners || newRoom.winners.length === 0) return;
  if (lastChipFlyHand === newRoom.handNumber) return; // already animated this hand's payout
  lastChipFlyHand = newRoom.handNumber;
  requestAnimationFrame(() => {
    const potEl = document.getElementById('pot-amount');
    const winnerEls = newRoom.winners.map(id => document.querySelector(`[data-player-id="${id}"]`)).filter(Boolean);
    if (potEl && winnerEls.length) animateChipsToWinners(potEl, winnerEls, newRoom.potBeforeAward || 0);
  });
}

async function startScanAnswerFlow(offerData) {
  stopQrLoop();
  app.innerHTML = renderScanScreenShell('Scan their code', 'Step 2 of 2 — scan their answer', 'Point your camera at the code on their screen.');
  const video = document.getElementById('scan-video');
  const canvas = document.getElementById('scan-canvas');

  wirePasteFallback(async (answerObj) => { scanner.stop(); await proceedWithAnswer(offerData, answerObj); });

  const scanner = new QrScanner(video, canvas);
  try {
    const answerObj = await runScanWithFeedback(scanner);

  } catch (e) {

async function proceedWithAnswer(offerData, answerObj) {
  await applyHostAnswer(offerData.pc, answerObj);
  app.innerHTML = renderConnectingShell('<span class="qr-spinner"></span>Connecting…');
  await waitForOpen(offerData.dc, 8000);
  const peerId = 'peer-' + Math.random().toString(36).slice(2);
  const countBefore = host.room.players.length;
  host.attachConnection(peerId, wrapDataChannel(offerData.dc));
  const newName = await waitForNewPlayerName(countBefore, 3000);
  showConnectedConfirmation(newName, renderHostLobby);

function waitForNewPlayerName(countBefore, timeoutMs) {
  return new Promise((resolve) => {
    const start = Date.now();
    const check = () => {
      if (host.room.players.length > countBefore) { resolve(host.room.players[host.room.players.length - 1].name); return; }
      if (Date.now() - start > timeoutMs) { resolve(null); return; }
      setTimeout(check, 60);
    };
    check();
  });
}

/* ---------- shared: wrap a real RTCDataChannel to the {send,onmessage,onclose} interface the controllers expect ---------- */
function wrapDataChannel(dc) {
  const wrapper = { send: (s) => dc.send(s), onmessage: null, onclose: null };
  dc.addEventListener('message', (e) => { if (wrapper.onmessage) wrapper.onmessage(e.data); });
  dc.addEventListener('close', () => { if (wrapper.onclose) wrapper.onclose(); });
  return wrapper;
}

/* ---------- QR display / scan shared screen shells ---------- */
/* ---------- QR display: manual, human-paced advance instead of a timer ----------
   No auto-cycling — flipping the code on a fixed timer means it can change
   before the other person's camera has even locked focus, which was the #1
   cause of pairing getting stuck. When more than one code is genuinely
   needed, the person SHOWING the code controls when it advances (their
   friend just tells them "got it" out loud), and the scanning side clearly
   reports what it has so they know when to say so. */
let qrFrames = [];
let qrFrameIdx = 0;
function showQrFrames(payloadStr, canvas, labelEl, nextBtnEl) {
  qrFrames = payloadToFrames(payloadStr);
  qrFrameIdx = 0;
  drawCurrentQrFrame(canvas, labelEl, nextBtnEl);
  nextBtnEl.onclick = () => {
    qrFrameIdx = (qrFrameIdx + 1) % qrFrames.length;
    drawCurrentQrFrame(canvas, labelEl, nextBtnEl);
  };
}
function drawCurrentQrFrame(canvas, labelEl, nextBtnEl) {
  renderQrToCanvas(qrFrames[qrFrameIdx], canvas, 8);
  if (qrFrames.length > 1) {
    labelEl.textContent = `Code ${qrFrameIdx + 1} of ${qrFrames.length}`;
    nextBtnEl.classList.remove('hidden');
    nextBtnEl.textContent = qrFrameIdx < qrFrames.length - 1
      ? "They've got this one — show the next code"
      : 'Back to the first code';
  } else {
    labelEl.textContent = '';
    nextBtnEl.classList.add('hidden');
  }
}
function stopQrLoop() { qrFrames = []; qrFrameIdx = 0; }
function renderQrScreenShell(title, step, subtitle) {
  return `
    <div class="center-col">
      <div class="card" style="text-align:center;">

        <p class="hint hidden" id="qr-waiting-note"><span class="qr-spinner"></span>Waiting for connection…</p>

}
function renderScanScreenShell(title, step, subtitle) {

/* ---------- Share/paste fallback: bypasses the camera entirely ----------
   Two people physically together can always exchange a short text blob some
   other way — AirDrop, Nearby Share, or just pasting into any messaging app
   — which sidesteps camera/lighting/focus issues completely. This shares
   the FULL, un-chunked payload as plain text (no QR chunking needed here,
   since text sharing has no scannability size limit). */
async function wireShareButton(payloadStr, title) {
  const btn = document.getElementById('qr-share-btn');
  if (!btn) return;
  btn.onclick = async () => {
    if (navigator.share) {
      try { await navigator.share({ title, text: payloadStr }); return; }
      catch (e) { return; } // user cancelled the share sheet — not an error
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(payloadStr);
        btn.textContent = 'Copied! Paste it to them in any app \u2192';
        setTimeout(() => { btn.textContent = 'Camera trouble? Share this code instead \u2192'; }, 2500);
        return;
      } catch (e) { /* fall through */ }
    }
    alert(payloadStr); // last resort: manually selectable text
  };
}

function wirePasteFallback(onPayload) {
  const toggle = document.getElementById('scan-paste-toggle');
  const panel = document.getElementById('scan-paste-panel');
  const input = document.getElementById('scan-paste-input');
  const connectBtn = document.getElementById('scan-paste-connect');
  const errEl = document.getElementById('scan-paste-err');
  if (!toggle) return;
  toggle.onclick = () => { panel.classList.toggle('hidden'); };
  connectBtn.onclick = async () => {
    errEl.classList.add('hidden');
    let parsed;
    try { parsed = JSON.parse(input.value.trim()); }
    catch (e) { errEl.textContent = "That doesn't look like a valid code \u2014 make sure you copied the whole thing."; errEl.classList.remove('hidden'); return; }
    try { await onPayload(parsed); }
    catch (e) { errEl.textContent = e.message || 'Could not connect with that code.'; errEl.classList.remove('hidden'); }
  };
}
