// Runs a scan with live, honest progress feedback (not just "Starting
// camera..." forever) and a troubleshooting hint if nothing's been caught
// after a few seconds — instead of leaving the person guessing whether
// anything is actually happening.
async function runScanWithFeedback(scanner) {
  const progressEl = document.getElementById('scan-progress');
  const troubleshootEl = document.getElementById('scan-troubleshoot');
  let anyProgress = false;
  let lastGot = 0;
  const troubleshootTimer = setTimeout(() => {
    if (troubleshootEl) {
      troubleshootEl.classList.remove('hidden');
      troubleshootEl.textContent = anyProgress
        ? "Got some of it — ask them to tap \u201cshow the next code\u201d on their screen if they haven't."
        : 'Nothing caught yet — try moving a bit closer, brightening the other screen, or holding it very still.';
    }
  }, 6000);
  try {
    const result = await scanner.start((got, total) => {
      if (progressEl) {
        if (got === total) {
          progressEl.innerHTML = `<span class="qr-spinner"></span>Got everything — connecting…`;
        } else if (got > lastGot) {
          // a fresh chunk just landed — this is the cue for the scanning
          // person to tell their friend out loud to advance to the next code
          progressEl.innerHTML = `<span class="qr-spinner"></span>Got code ${got}/${total} — tell them to show the next one!`;
        }
      }
      anyProgress = true;
      lastGot = got;
      if (troubleshootEl) troubleshootEl.classList.add('hidden');
    });
    return result;
  } finally {
    clearTimeout(troubleshootTimer);
  }
}

/* ---------- gesture system: swipe between tabs, pull-to-refresh, long-press player ---------- */
function wireTabGestures(room) {
  const el = document.getElementById('tab-content');
  if (!el) return;
  let startX = 0, startY = 0, startT = 0, tracking = false;
  let pulled = false;

  el.addEventListener('pointerdown', (e) => {
    startX = e.clientX; startY = e.clientY; startT = Date.now(); tracking = true; pulled = false;
  });
  el.addEventListener('pointermove', (e) => {
    if (!tracking) return;
    const dy = e.clientY - startY;
    if (dy > 70 && el.scrollTop === 0 && !pulled) {
      pulled = true;
      showPullToRefreshPulse();
    }
  });
  el.addEventListener('pointerup', (e) => {
    if (!tracking) return;
    tracking = false;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    const elapsed = Date.now() - startT;
    const dir = classifySwipe(dx, dy, elapsed);
    if (dir === 'swipe-left' || dir === 'swipe-right') {
      const next = nextTabForSwipe(activeTab, dir);
      if (next !== activeTab) { activeTab = next; renderInGameShell(currentRoom); }
    } else if (dir === 'swipe-down' && el.scrollTop === 0) {
      showPullToRefreshPulse();
    }
  });
  el.addEventListener('pointercancel', () => { tracking = false; });

  // long-press on a player card -> details sheet
  el.querySelectorAll('.player-card').forEach(card => {
    let pressTimer = null, downX = 0, downY = 0, moved = 0;
    card.addEventListener('pointerdown', (e) => {
      downX = e.clientX; downY = e.clientY; moved = 0;
      pressTimer = setTimeout(() => {
        const pid = card.dataset.playerId;
        const p = currentRoom.players.find(pl => pl.id === pid);
        if (p) openPlayerDetailSheet(p, currentRoom);
      }, 500);
    });
    card.addEventListener('pointermove', (e) => {
      moved = Math.hypot(e.clientX - downX, e.clientY - downY);
      if (moved > 12 && pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => card.addEventListener(evt, () => {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    }));
  });
}

function showPullToRefreshPulse() {
  playSound('chip');
  const el = document.getElementById('tab-content');
  if (!el) return;
  el.style.transition = 'opacity 120ms ease';
  el.style.opacity = '0.55';
  setTimeout(() => { el.style.opacity = '1'; }, 140);
  if (currentRoom) renderActiveTab(currentRoom);
}

function openPlayerDetailSheet(p, room) {
  const netChange = (startingStackForHistory || room.startingStack) ? p.stack - (startingStackForHistory || room.startingStack) : null;

    <div class="sheet-amount mono">${p.stack.toLocaleString()}</div>
    <div class="hint" style="text-align:center;margin-top:-6px;margin-bottom:14px;">
      ${netChange !== null ? (netChange >= 0 ? `+${netChange.toLocaleString()} this game` : `${netChange.toLocaleString()} this game`) : ''}
      ${p.connected ? '' : ' · offline'}
      ${p.id === room.dealerId ? ' · dealer' : ''}

  document.body.appendChild(backdrop);

/* ---------- Table tab ---------- */
function seatOrderOf(room) { return activeSeatOrder(room.players); }
function toCallFor(room, p) { return Math.max(0, room.currentBet - p.contributedThisStreet); }

function playerCardHtml(room, p, opts) {
  opts = opts || {};
  const isTurn = room.status === 'playing' && room.turnPlayerId === p.id;
  const isYou = p.id === me.playerId;
  const isWinner = room.winners && room.winners.includes(p.id) && room.street === 'handover';
  const classes = ['player-card'];
  if (isTurn) classes.push('is-turn');
  if (p.eliminated) classes.push('is-out');
  else if (p.folded) classes.push('is-folded');
  if (isWinner) classes.push('is-winner');
  const dealerBadge = p.id === room.dealerId ? `<span class="pc-dealer-dot" style="${p.id === room.dealerId ? 'view-transition-name:vt-dealer;' : ''}">● DEALER</span>` : '';
  const sbBadge = opts.sbId === p.id ? '<span class="pc-bet-chip">SB</span>' : '';
  const bbBadge = opts.bbId === p.id ? '<span class="pc-bet-chip">BB</span>' : '';
  const statusText = p.eliminated ? 'out' : p.folded ? 'folded' : p.allIn ? 'all-in' : !p.connected ? 'offline' : '';
  return `
    <div class="${classes.join(' ')}" style="view-transition-name:vt-player-${p.id};" data-player-id="${p.id}">
      <div class="pc-top">
        <div class="pc-name-row">
          <span class="pc-status-dot ${p.connected ? 'online' : ''}"></span>
          <span class="pc-name">${escapeHtml(p.name)}${isYou ? ' (you)' : ''}</span>
        </div>
        ${isTurn && isYou ? '<span class="pc-your-turn">⚡ YOUR TURN</span>' : isTurn ? '<span class="pc-your-turn">thinking…</span>' : ''}
        <div class="pc-badges">${sbBadge}${bbBadge}</div>
      </div>
      <div class="pc-stack mono" data-tween="stack-${p.id}">${p.stack.toLocaleString()}</div>
      <div class="pc-bottom">
        ${dealerBadge}
        ${statusText ? `<span>${statusText}</span>` : ''}
        ${p.contributedThisStreet > 0 ? `<span class="pc-bet-chip">bet ${p.contributedThisStreet}</span>` : ''}
      </div>
    </div>`;
}

function renderTableTab(room, container) {
  const order = seatOrderOf(room);
  const meP = room.players.find(p => p.id === me.playerId);
  const isMyTurn = room.turnPlayerId === me.playerId;
  let sbId = null, bbId = null;
  if (order.length >= 2) {
    if (order.length === 2) { sbId = room.dealerId; bbId = nextPlayerAfter(order, room.dealerId).id; }
    else { const sb = nextPlayerAfter(order, room.dealerId); sbId = sb.id; bbId = nextPlayerAfter(order, sb.id).id; }
  }
  const displayPlayers = [...room.players].sort((a, b) => a.seat - b.seat);

  if (room.status === 'over') {
    container.innerHTML = renderGameOverHtml(room);
    wireGameOverButtons(room);
    return;
  }

  container.innerHTML = `
    <div class="top-links">
      <span class="hint" style="margin:0;">${me.isHost ? 'Hosting' : 'Connected'}</span>
      <span class="hand-num mono">Hand #${room.handNumber}</span>
    </div>
    <div class="table-header">
      <div class="street-badge">${room.street}</div>
      <div class="pot-box"><div class="pot-label">Pot</div><div class="pot-amount mono" id="pot-amount" style="view-transition-name:vt-pot;">${room.pot.toLocaleString()}</div></div>
      <div style="width:70px;text-align:right;">
        <div class="pot-label">To call</div>
        <div class="mono" style="font-size:16px;color:${meP && toCallFor(room, meP) > 0 ? 'var(--gold-bright)' : 'var(--ink-faint)'}">${meP ? toCallFor(room, meP) : '—'}</div>
      </div>
    </div>
    <div class="players-list" style="display:flex;flex-direction:column;gap:10px;">
      ${displayPlayers.map(p => playerCardHtml(room, p, { sbId, bbId })).join('')}
    </div>
    <div class="log-panel" id="log-panel">${(room.log || []).slice(-8).map(l => `<div>${escapeHtml(l)}</div>`).join('')}</div>
    <div class="action-bar" id="action-bar"></div>`;

  tweenVisibleNumbers(room, container);

  const actionBar = document.getElementById('action-bar');
  if (room.street === 'showdown') renderShowdownPanel(room, actionBar);
  else if (room.street === 'handover') renderHandoverPanel(room, actionBar);
  else if (isMyTurn && meP && !meP.folded && !meP.eliminated) renderActionPanel(room, meP, actionBar);
  else {
    const turnP = room.players.find(p => p.id === room.turnPlayerId);
    actionBar.innerHTML = `<div class="waiting-note">${turnP ? `Waiting for <strong>${escapeHtml(turnP.name)}</strong>…` : 'Waiting…'}</div>`;
  }
  const logPanel = document.getElementById('log-panel');
  if (logPanel) logPanel.scrollTop = logPanel.scrollHeight;
}

function tweenVisibleNumbers(room, container) {
  const potEl = container.querySelector('#pot-amount');
  if (potEl) tweenNumber(potEl, 'pot', room.pot, { duration: 320 });
  container.querySelectorAll('[data-tween^="stack-"]').forEach(el => {
    const pid = el.dataset.tween.replace('stack-', '');
    const p = room.players.find(pl => pl.id === pid);
    if (p) tweenNumber(el, 'stack-' + pid, p.stack, { duration: 320 });
  });
}

function renderActionPanel(room, meP, container) {
  const toCall = toCallFor(room, meP);
  const canCheck = toCall === 0;
  container.innerHTML = `
    <div class="action-grid">
      <button class="btn-danger" id="act-fold">Fold</button>
      <button class="btn-primary" id="act-callcheck">${canCheck ? 'Check' : `Call ${toCall}`}</button>
    </div>
    <div class="action-grid" style="margin-top:8px;">
      <button class="btn-ghost" id="act-open-raise" ${room.currentBet >= room.maxBet ? 'disabled' : ''}>Raise…</button>
      <button class="btn-ghost" id="act-allin">All-in (${meP.stack})</button>
    </div>`;
  document.getElementById('act-fold').onclick = () => doAction('fold');
  document.getElementById('act-callcheck').onclick = () => doAction(canCheck ? 'check' : 'call');
  document.getElementById('act-allin').onclick = () => doAction('allin');
  const raiseBtn = document.getElementById('act-open-raise');
  if (raiseBtn) raiseBtn.onclick = () => openRaiseSheet(room, meP);
}

function openRaiseSheet(room, meP) {
  const minRaise = Math.min(room.currentBet + room.bigBlind, room.maxBet, meP.stack + meP.contributedThisStreet);
  const maxRaise = Math.min(room.maxBet, meP.stack + meP.contributedThisStreet);
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  const sheet = document.createElement('div');
  sheet.className = 'bottom-sheet';
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-title">Raise to</div>
    <div class="sheet-amount mono" id="sheet-amount">${minRaise.toLocaleString()}</div>
    <input type="range" class="sheet-slider" id="sheet-slider" min="${minRaise}" max="${maxRaise}" step="${Math.max(10, room.bigBlind)}" value="${minRaise}">
    <div class="sheet-actions">
      <button class="btn-ghost" id="sheet-cancel">Cancel</button>
      <button class="btn-primary" id="sheet-confirm">Raise</button>
    </div>`;
  document.body.appendChild(backdrop);
  document.body.appendChild(sheet);
  requestAnimationFrame(() => { backdrop.classList.add('open'); sheet.classList.add('open'); });

  const closeSheet = () => {
    backdrop.classList.remove('open'); sheet.classList.remove('open');
    setTimeout(() => { backdrop.remove(); sheet.remove(); }, 240);
  };
  backdrop.onclick = closeSheet;
  document.getElementById('sheet-cancel').onclick = closeSheet;
  const slider = document.getElementById('sheet-slider');
  const amountEl = document.getElementById('sheet-amount');
  slider.oninput = () => { amountEl.textContent = parseInt(slider.value, 10).toLocaleString(); };
  document.getElementById('sheet-confirm').onclick = () => {
    const val = parseInt(slider.value, 10);
    closeSheet();
    doAction('raise', val);
  };
}

function doAction(action, amount) {
  if (submitting) return;
  submitting = true;
  try {
    if (me.isHost) host.applyLocalAction(action, amount);
    else guest.sendAction(action, amount);
  } catch (e) { alert(e.message); }
  finally { submitting = false; }
}

function renderShowdownPanel(room, container) {
  const contenders = room.players.filter(p => !p.eliminated && !p.folded);
  container.innerHTML = `
    <div class="card">
      <label style="text-align:center;">Cards are on the table — who won?</label>
      <p class="hint" style="text-align:center;margin-top:0;">Select one winner, or more than one for a split pot.</p>
      <div class="winner-select" id="winner-select">
        ${contenders.map(p => `<label class="winner-opt" data-id="${p.id}"><input type="checkbox" value="${p.id}"><span>${escapeHtml(p.name)}</span><span class="mono" style="margin-left:auto;color:var(--ink-faint);">stack ${p.stack.toLocaleString()}</span></label>`).join('')}
      </div>
      <button class="btn-primary btn-block" id="btn-award" disabled>Award pot (${room.pot.toLocaleString()})</button>
    </div>`;
  const selected = new Set();
  container.querySelectorAll('.winner-opt').forEach(el => {
    el.onclick = (e) => {
      const id = el.dataset.id, cb = el.querySelector('input');
      if (e.target !== cb) cb.checked = !cb.checked;
      if (cb.checked) { selected.add(id); el.classList.add('selected'); } else { selected.delete(id); el.classList.remove('selected'); }
      document.getElementById('btn-award').disabled = selected.size === 0;
    };
  });
  document.getElementById('btn-award').onclick = () => {
    if (selected.size === 0) return;
    const ids = [...selected];
    try { if (me.isHost) host.localDeclareWinners(ids); else guest.sendDeclareWinners(ids); }
    catch (e) { alert(e.message); }
  };
}

function renderHandoverPanel(room, container) {
  const lastLine = (room.log || []).slice(-1)[0] || '';
  container.innerHTML = `<div class="card" style="text-align:center;"><p style="margin:0 0 12px;font-weight:600;">${escapeHtml(lastLine)}</p><button class="btn-primary btn-block" id="btn-next-hand">Deal next hand</button></div>`;
  document.getElementById('btn-next-hand').onclick = () => { try { if (me.isHost) host.localNextHand(); else guest.sendNextHand(); } catch (e) { alert(e.message); } };
}

/* ---------- Players tab (read-only roster) ---------- */
function renderPlayersTab(room, container) {
  const players = [...room.players].sort((a, b) => a.seat - b.seat);
  container.innerHTML = `
    <div class="top-links"><span class="hint" style="margin:0;">Full roster</span><span class="hint" style="margin:0;">${players.length} players</span></div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${players.map(p => playerCardHtml(room, p, {})).join('')}
    </div>`;
  tweenVisibleNumbers(room, container);
}

/* ---------- History tab ---------- */
function renderHistoryTab(container) {
  const list = loadHistory();
  if (list.length === 0) {
    container.innerHTML = `<div class="top-links"><span class="hint" style="margin:0;">Game history</span></div><div class="history-empty">No completed games on this device yet.<br>Finish a game and it'll show up here.</div>`;
    return;
  }
  const groups = groupHistoryByDay(list);
  container.innerHTML = `
    <div class="top-links"><span class="hint" style="margin:0;">Game history</span></div>
    ${groups.map(g => `
      <div class="history-group-label">${escapeHtml(g.label)}</div>
      ${g.entries.map(e => `
        <div class="history-entry">
          <div class="history-entry-top"><span>${e.players.length} players</span><span>Hands: ${e.handsPlayed}</span></div>
          ${e.players.slice(0, 3).map((p, i) => `
            <div class="history-medal-row">
              <span class="medal">${['🥇', '🥈', '🥉'][i] || ''}</span>
              <span style="flex:1;">${escapeHtml(p.name)}</span>
              <span class="${p.netChange >= 0 ? 'net-pos' : 'net-neg'}">${p.netChange >= 0 ? '+' : ''}${p.netChange.toLocaleString()}</span>
            </div>`).join('')}
        </div>`).join('')}
    `).join('')}
    <p class="hint" style="text-align:center;">Stored only on this device — not shared with other players.</p>`;
}

/* ---------- Settings tab ---------- */
function renderSettingsTab(room, container) {
  const swStatus = getServiceWorkerStatus();
  const swLabel = {
    'registered': '✓ Active (fully installed)',
    'unavailable-file-protocol': 'Not available — opened as a local file',
    'failed': 'Not available on this browser',
    'unsupported': 'Not supported on this browser',
  }[swStatus] || 'Unknown';
  container.innerHTML = `
    <div class="top-links"><span class="hint" style="margin:0;">Settings</span></div>
    <div class="card" style="margin-bottom:16px;">
      <div class="settings-row"><div><div class="settings-row-label">Blinds</div><div class="settings-row-sub">Small / big</div></div><span class="mono">${room.smallBlind} / ${room.bigBlind}</span></div>
      <div class="settings-row"><div><div class="settings-row-label">Max bet</div><div class="settings-row-sub">Per raise</div></div><span class="mono">${room.maxBet.toLocaleString()}</span></div>
      <div class="settings-row"><div><div class="settings-row-label">Starting stack</div></div><span class="mono">${room.startingStack.toLocaleString()}</span></div>
      <div class="settings-row"><div><div class="settings-row-label">Role</div></div><span>${me.isHost ? 'Host' : 'Guest'}</span></div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div class="settings-row">
        <div><div class="settings-row-label">Sound effects</div><div class="settings-row-sub">Turn, all-in, bust, win chimes</div></div>
        <label class="switch"><input type="checkbox" id="sound-toggle" ${isSoundMuted() ? '' : 'checked'}><span class="switch-track"></span></label>
      </div>
      <div class="settings-row">
        <div><div class="settings-row-label">Background offline install</div><div class="settings-row-sub">${swLabel}</div></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <button class="btn-ghost btn-block" id="settings-install">📲 Add to home screen</button>
      <p class="hint" style="text-align:center;margin:10px 0 0;">Tip: swipe left/right on any tab to switch, or long-press a player card for details.</p>
    </div>
    <div class="card">
      <button class="btn-danger btn-block" id="settings-leave">Leave table</button>
    </div>`;
  document.getElementById('sound-toggle').onchange = (e) => { setSoundMuted(!e.target.checked); };
  document.getElementById('settings-install').onclick = handleInstallClick;
  document.getElementById('settings-leave').onclick = () => {
    if (!confirm('Leave this table? You can rejoin with the same name if the host adds you again.')) return;
    location.reload();
  };
}

/* ---------- Game over ---------- */
function renderGameOverHtml(room) {
  const standings = [...room.players].sort((a, b) => b.stack - a.stack);
  const winner = standings[0];
  return `
    <div class="card" style="margin-bottom:16px;">
      <div class="gameover-trophy">🏆</div>
      <div class="gameover-winner">${escapeHtml(winner.name).toUpperCase()} WINS</div>
      <div class="gameover-sub">1st — ${winner.stack.toLocaleString()}</div>
      <ul class="lobby-players standings" style="margin-top:16px;">
        ${standings.map((p, i) => `<li><span class="place mono">#${i + 1}</span><span class="pname">${escapeHtml(p.name)}${p.id === me.playerId ? ' (you)' : ''}</span><span class="mono">${p.stack.toLocaleString()}</span></li>`).join('')}
      </ul>
    </div>
    ${me.isHost ? `
      <button class="btn-primary btn-block" id="btn-rematch" style="margin-bottom:10px;">Play again</button>
      <p class="hint" style="text-align:center;margin:-4px 0 10px;">Same players • Same settings</p>
      <button class="btn-ghost btn-block" id="btn-new-table">New table</button>
    ` : `<p class="hint" style="text-align:center;">Waiting for the host to start a new game…</p>`}`;
}
function wireGameOverButtons(room) {
  const rematchBtn = document.getElementById('btn-rematch');
  if (rematchBtn) rematchBtn.onclick = () => { historySaved = false; host.doRematch(); activeTab = 'table'; };
  const newTableBtn = document.getElementById('btn-new-table');
  if (newTableBtn) newTableBtn.onclick = () => { if (confirm('Start a brand new table? This ends the current one for everyone.')) location.reload(); };
}

/* ---------- haptics + sound wiring ---------- */
function detectAndFireFeedback(prevRoom, newRoom) {
  if (!prevRoom || !newRoom) return;
  if (newRoom.handNumber > prevRoom.handNumber) playSound('deal');
  if (newRoom.pot > prevRoom.pot) playSound('chip');
  if (!me.playerId) return;
  const prevP = prevRoom.players.find(p => p.id === me.playerId);
  const newP = newRoom.players.find(p => p.id === me.playerId);
  if (!newP) return;
  if (newRoom.turnPlayerId === me.playerId && prevRoom.turnPlayerId !== me.playerId) { haptic('turn'); playSound('turn'); }
  if (newP.allIn && prevP && !prevP.allIn) { haptic('allin'); playSound('allin'); }
  if (newP.eliminated && prevP && !prevP.eliminated) { haptic('bust'); playSound('bust'); }
  if (newRoom.winners && newRoom.winners.includes(me.playerId) && newRoom.street === 'handover' && (!prevRoom.winners || prevRoom.winners.join(',') !== newRoom.winners.join(','))) { haptic('win'); playSound('win'); }
}

/* ---------- utils ---------- */
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

boot();

</script>
